# The following rustfmt.toml requires the Nightly toolchain. Please DO NOT run with the Stable
# toolchain.

# Stable Features
max_width = 100
array_width = 100
attr_fn_like_width = 100
chain_width = 100
fn_call_width = 100
single_line_if_else_max_width = 100
struct_lit_width = 100
struct_variant_width = 100
use_small_heuristics = "Max"
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"

# Unstable Features (requires Nightly)
unstable_features = true
control_brace_style = "ClosingNextLine"
# wrap_comments = true
# comment_width = 100
