name: Hosted CI

on:
  push:
    branches: [main, algo/ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: 'true'
      ARTCRAFT_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/artcraft_test
    services:
      mysql:
        image: mysql:8.0
        command: --socket=/tmp/mysql.sock
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: artcraft_test
        ports:
          - 3306:3306
        volumes:
          - /tmp:/tmp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev fonts-noto-cjk fonts-unifont ffmpeg
      - name: Verify local MySQL test socket
        run: test -S /tmp/mysql.sock
      # Existing baseline-wide formatter drift is tracked in hyper#262.
      - name: Rust formatting check (tracked exception)
        run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets
      - name: Workspace tests
        run: cargo test --workspace --no-fail-fast
